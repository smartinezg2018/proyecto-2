name: JavaScript CI / Quality Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix apps/api

      - name: Verificar Formato (Prettier)
        run: npx prettier --check .

      - name: Ejecutar Análisis Estático (ESLint)
        run: npm run lint

      - name: Ejecutar pruebas funcionales
        run: npm test
